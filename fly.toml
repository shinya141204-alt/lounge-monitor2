# Fly.io Tokyo (`nrt`) High-Speed Architecture Configuration (Plan Take)
# Zero Google Cloud dependency: Fly.io Tokyo Machines + Fly Postgres Tokyo + Upstash Redis Tokyo

app = "aiseki-navi-tokyo"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "25s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_SITE_URL = "https://aiseki-navi.com"
  ENABLE_PUBLIC_EDGE_CACHE = "1"
  PYTHONUNBUFFERED = "1"
  TZ = "UTC"

[processes]
  app = "sh -c 'APP_ROLE=web exec gunicorn --workers 2 --threads 16 --timeout 60 --graceful-timeout 20 -b 0.0.0.0:8080 app:app'"
  worker = "sh -c 'APP_ROLE=worker exec python3 worker.py'"

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "25s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
