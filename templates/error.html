<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ code }} {{ title }}｜相席ナビ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/icon-192.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/portal.css?v=10">
    <style>
        :root {
            --bg-dark: #0c0d10;
            --card-bg: #16181f;
            --card-bg-2: #1f222c;
            --border-color: rgba(235, 232, 227, 0.16);
            --border-gold: rgba(200, 164, 110, 0.48);
            --text-main: #f0ede8;
            --text-sub: #b5b0a6;
            --accent-gold: #c8a46e;
            --accent-text: #e3c898;
        }
        body.theme-light {
            --bg-dark: #eeebe2;
            --card-bg: #ffffff;
            --card-bg-2: #e4dfd4;
            --border-color: rgba(28, 26, 23, 0.18);
            --border-gold: rgba(110, 79, 35, 0.48);
            --text-main: #1b1916;
            --text-sub: #4d4840;
            --accent-gold: #6e4f23;
            --accent-text: #6e4f23;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .error-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px double var(--border-gold);
            background: var(--bg-dark);
        }
        .error-logo {
            font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
            font-size: 1.32rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .error-logo .badge {
            font-family: "Outfit", sans-serif;
            background: rgba(200, 164, 110, 0.14);
            border: 1px solid var(--border-gold);
            color: var(--accent-text);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }
        .error-container {
            max-width: 620px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent-gold);
            border-radius: 14px;
            padding: 40px 26px;
        }
        .error-code {
            font-family: "Outfit", sans-serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.06em;
            margin: 0 0 14px;
            color: var(--accent-text);
        }
        .error-title {
            font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
            font-size: 1.32rem;
            font-weight: 700;
            margin: 0 0 12px;
            color: var(--text-main);
        }
        .error-message {
            font-size: 0.92rem;
            color: var(--text-sub);
            line-height: 1.75;
            margin: 0 0 28px;
        }
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 999px;
            background: var(--card-bg-2);
            border: 1px solid var(--border-gold);
            color: var(--accent-text);
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn-primary:hover {
            background: rgba(200, 164, 110, 0.18);
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .nav-link {
            color: var(--text-sub);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            padding: 6px 13px;
            border-radius: 999px;
            background: var(--card-bg-2);
            border: 1px solid var(--border-color);
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .nav-link:hover {
            border-color: var(--border-gold);
            color: var(--text-main);
        }
        .error-footer {
            padding: 22px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.78rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
    <link rel="stylesheet" href="/static/calm.css?v=21">
</head>
<body>
    <script>
        try {
            if (localStorage.getItem('olg_view_theme') === 'light') {
                document.body.classList.add('theme-light');
            }
        } catch (e) {}
    </script>
    <header class="error-header">
        <a href="/" class="error-logo">
            相席ナビ <span class="badge">LIVE JOURNAL</span>
        </a>
    </header>

    <main class="error-container">
        <div class="error-card">
            <div class="error-code">{{ code }}</div>
            <h1 class="error-title">{{ title }}</h1>
            <p class="error-message">{{ message }}</p>

            <div class="error-actions">
                <a href="/" class="btn-primary">リアルタイム順位トップへ戻る ›</a>
                <div class="nav-links">
                    <a href="/oriental-lounge" class="nav-link">オリエンタルラウンジ</a>
                    <a href="/ag" class="nav-link">ag（アグ）</a>
                    <a href="/jis" class="nav-link">JIS</a>
                    <a href="/columns" class="nav-link">攻略コラム</a>
                    <a href="/concierge" class="nav-link">3秒ハシゴ診断</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="error-footer">
        &copy; 相席ナビ / AISEKI NAVI. All rights reserved.
    </footer>
</body>
</html>
