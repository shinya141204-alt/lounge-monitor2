<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ code }} {{ title }}｜相席ナビ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/icon-192.png?v=2">
    <link rel="stylesheet" href="/static/style.css?v=20261030_3">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --card-bg: rgba(22, 24, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f0f2f5;
            --text-sub: #9ba1b0;
            --accent-pink: #ff2d75;
            --accent-cyan: #00e5ff;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justifyContent: space-between;
        }
        .error-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
        }
        .error-logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-logo .badge {
            background: linear-gradient(135deg, var(--accent-pink), #e0005a);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .error-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }
        .error-code {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            margin: 0 0 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0 0 12px;
            color: #ffffff;
        }
        .error-message {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), #00a0dc);
            color: #050510;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        .nav-link {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.2s, color 0.2s;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .error-footer {
            padding: 20px;
            text-align: center;
            color: #555b6d;
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <header class="error-header">
        <a href="/" class="error-logo">
            相席ナビ <span class="badge">LIVE</span>
        </a>
    </header>

    <main class="error-container">
        <div class="error-card">
            <div class="error-code">{{ code }}</div>
            <h1 class="error-title">{{ title }}</h1>
            <p class="error-message">{{ message }}</p>

            <div class="error-actions">
                <a href="/" class="btn-primary">トップページへ戻る</a>
                <div class="nav-links">
                    <a href="/oriental-lounge" class="nav-link">オリエンタルラウンジ</a>
                    <a href="/ag" class="nav-link">ag（アグ）</a>
                    <a href="/jis" class="nav-link">JIS</a>
                    <a href="/columns" class="nav-link">攻略コラム</a>
                    <a href="/concierge" class="nav-link">ハシゴ診断</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="error-footer">
        &copy; 相席ナビ / AISEKI NAVI. All rights reserved.
    </footer>
</body>
</html>
