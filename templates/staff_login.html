<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>社内業務モニター ログイン｜相席ナビ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/icon-192.png?v=2">
    <link rel="apple-touch-icon" href="/static/icon.png?v=2">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .bg-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            top: -150px;
            left: -150px;
            z-index: 0;
        }
        .bg-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.16) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: rgba(18, 20, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid rgba(236, 72, 153, 0.35);
            color: #f472b6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff 0%, #f3e8ff 50%, #f9a8d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-align: center;
        }
        .passcode-input {
            width: 100%;
            height: 54px;
            background: rgba(10, 10, 16, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.35em;
            padding: 0 16px;
            outline: none;
            transition: all 0.2s ease;
        }
        .passcode-input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 16px rgba(236, 72, 153, 0.3);
            background: rgba(15, 15, 24, 0.95);
        }
        .passcode-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.1em;
            font-size: 1.1rem;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
            font-weight: 600;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6 0%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
        }
        .submit-btn:active {
            transform: translateY(1px);
        }
        .back-link {
            display: inline-block;
            margin-top: 22px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="login-card">
        <div class="badge">🔒 STAFF / MASTER</div>
        <h1>社内・マスター認証</h1>
        <p class="desc">
            広告・PRを一切表示しない業務専用モニタリング画面です。<br>
            スタッフ用（現場データ専用）またはマスター用パスコードを入力してください。
        </p>

        <form method="POST" action="/staff" autocomplete="off">
            <div class="form-group">
                <label for="passcode">パスコード</label>
                <input 
                    type="password" 
                    id="passcode" 
                    name="passcode" 
                    class="passcode-input" 
                    placeholder="••••" 
                    maxlength="32" 
                    required 
                    autofocus
                >
                {% if error %}
                <div class="error-msg">⚠️ {{ error }}</div>
                {% endif %}
            </div>

            <button type="submit" class="submit-btn">認証してモニターを開く</button>
        </form>

        <a href="/" class="back-link">← 一般サイト（相席ナビ）へ戻る</a>
    </div>
    <script>
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            try { navigator.serviceWorker.controller.postMessage({ type: 'PURGE_HTML_CACHE' }); } catch (e) {}
        }
    </script>
</body>
</html>
