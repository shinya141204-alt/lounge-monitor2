<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>社内業務モニター ログイン｜相席ナビ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/icon-192.png?v=3">
    <link rel="apple-touch-icon" href="/static/icon.png?v=3">
    <meta name="theme-color" content="#111113" id="staff-theme-meta">
    <style>
        :root {
            --bg: #111113;
            --surface: #18181b;
            --surface-2: #232329;
            --input-bg: #111113;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #f4f4f5;
            --sub: #c4c4cc;
            --placeholder: rgba(244, 244, 245, 0.38);
            --gold: #f4f4f5;
            --gold-soft: rgba(244, 244, 245, 0.09);
            --gold-border: rgba(244, 244, 245, 0.24);
            --gold-ink: #f4f4f5;
            --btn-primary-ink: #111113;
            --err-ink: #fecaca;
            --card-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
            --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        }
        body.theme-light {
            --bg: #f6f6f7;
            --surface: #ffffff;
            --surface-2: #ededf0;
            --input-bg: #ffffff;
            --border: rgba(24, 24, 27, 0.10);
            --border-strong: rgba(24, 24, 27, 0.20);
            --text: #18181b;
            --sub: #3f3f46;
            --placeholder: rgba(24, 24, 27, 0.40);
            --gold: #18181b;
            --gold-soft: rgba(24, 24, 27, 0.06);
            --gold-border: rgba(24, 24, 27, 0.22);
            --gold-ink: #18181b;
            --btn-primary-ink: #ffffff;
            --err-ink: #7f1d1d;
            --card-shadow: 0 12px 32px rgba(24, 24, 27, 0.07);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            position: relative;
        }
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            padding: 28px 26px 32px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }
        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            color: var(--gold-ink);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 999px;
            letter-spacing: 0.06em;
        }
        .pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.74rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .pill-btn:hover {
            border-color: var(--gold);
        }
        h1 {
            font-size: 1.36rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .desc {
            font-size: 0.82rem;
            color: var(--sub);
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--sub);
            margin-bottom: 8px;
            text-align: center;
        }
        .passcode-input {
            width: 100%;
            max-width: 100%;
            height: 54px;
            background: var(--input-bg);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            color: var(--text);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.32em;
            padding: 0 16px;
            outline: none;
            font-variant-numeric: tabular-nums;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .passcode-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-soft);
        }
        .passcode-input::placeholder {
            color: var(--placeholder);
            letter-spacing: 0.1em;
            font-size: 1.1rem;
        }
        .error-msg {
            color: var(--err-ink);
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
            font-weight: 600;
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            background: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 999px;
            color: var(--btn-primary-ink);
            font-size: 0.94rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.18s ease;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .back-link {
            display: inline-block;
            margin-top: 22px;
            font-size: 0.78rem;
            color: var(--sub);
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <script>
        (function() {
            try {
                if (localStorage.getItem('olg_view_theme') === 'light') {
                    document.body.classList.add('theme-light');
                    var meta = document.getElementById('staff-theme-meta');
                    if (meta) meta.setAttribute('content', '#f6f6f7');
                }
            } catch (e) {}
        })();
        function toggleStaffTheme() {
            var isLight = document.body.classList.toggle('theme-light');
            try {
                localStorage.setItem('olg_view_theme', isLight ? 'light' : 'default');
            } catch (e) {}
            var meta = document.getElementById('staff-theme-meta');
            if (meta) meta.setAttribute('content', isLight ? '#f6f6f7' : '#111113');
            var btn = document.getElementById('staff-theme-toggle-btn');
            if (btn) {
                btn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
            }
        }
    </script>

    <div class="login-card">
        <div class="card-top-row top-links">
            <div class="badge">STAFF / MASTER</div>
            <button type="button" class="pill-btn" onclick="toggleStaffTheme()" id="staff-theme-toggle-btn">ライト / ダーク</button>
        </div>
        <h1>社内・マスター認証</h1>
        <p class="desc">
            広告・PRを一切表示しない業務専用モニタリング画面です。<br>
            スタッフ用（現場データ専用）またはマスター用パスコードを入力してください。
        </p>

        <form method="POST" action="/staff" autocomplete="off">
            <div class="form-group">
                <label for="passcode">パスコード</label>
                <input 
                    type="password" 
                    id="passcode" 
                    name="passcode" 
                    class="passcode-input" 
                    placeholder="••••" 
                    maxlength="32" 
                    required 
                    autofocus
                >
                {% if error %}
                <div class="error-msg">⚠️ {{ error }}</div>
                {% endif %}
            </div>

            <button type="submit" class="submit-btn">認証してモニターを開く</button>
        </form>

        <a href="/" class="back-link">← 一般サイト（相席ナビ）へ戻る</a>
    </div>
    <script>
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            try { navigator.serviceWorker.controller.postMessage({ type: 'PURGE_HTML_CACHE' }); } catch (e) {}
        }
    </script>
</body>
</html>
