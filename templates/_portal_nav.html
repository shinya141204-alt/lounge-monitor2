{#- ポータル共通グローバルナビ。
    使い方: {% set nav_active = 'columns' %}{% include '_portal_nav.html' %}
    nav_active: 'ranking' | 'price_comparison' | 'for_women' | 'areas' | 'columns' | 'stats' | 'comparison' | 'grooming'（未指定ならアクティブなし）
    スタイルの共通部分は /static/portal.css、ページ固有の差分は各ページの <style> に記述。 -#}
<script>
(function(){
    try {
        if (!document.body.classList.contains('audience-women') && localStorage.getItem('olg_view_theme') === 'light') {
            document.body.classList.add('theme-light');
        }
    } catch (e) {}
    window.__syncPortalThemeBtns = function() {
        var isLight = document.body.classList.contains('theme-light');
        var nodes = document.querySelectorAll('.portal-theme-btn-text');
        for (var i = 0; i < nodes.length; i++) {
            nodes[i].textContent = isLight ? '🌙 ダーク' : '☀️ ライト';
        }
    };
    window.__togglePortalTheme = function() {
        var isLight = document.body.classList.toggle('theme-light');
        try {
            localStorage.setItem('olg_view_theme', isLight ? 'light' : 'default');
            if (document.body.classList.contains('audience-women')) {
                localStorage.setItem('aiseki_women_manual_theme', isLight ? 'light' : 'default');
            }
        } catch (e) {}
        window.__syncPortalThemeBtns();
    };
})();
</script>
<div class="portal-global-nav-row">
        <nav class="portal-global-nav" aria-label="メインナビゲーション">
            <a href="/" class="portal-nav-item{% if nav_active == 'ranking' %} active{% endif %}">リアルタイム順位</a>
            <a href="/concierge" class="portal-nav-item{% if nav_active == 'concierge' %} active{% endif %}">🧭 3秒ハシゴ診断</a>
            <a href="/for-women" class="portal-nav-item{% if nav_active == 'for_women' %} active{% endif %}">💄 女子向け裏ガイド</a>
            <a href="/price-comparison" class="portal-nav-item{% if nav_active == 'price_comparison' %} active{% endif %}">料金・イベント比較</a>
            <a href="/columns" class="portal-nav-item{% if nav_active == 'columns' %} active{% endif %}">コラム・記事一覧</a>
            <a href="/areas" class="portal-nav-item{% if nav_active == 'areas' %} active{% endif %}">エリアから探す</a>
            <a href="/stats" class="portal-nav-item{% if nav_active == 'stats' %} active{% endif %}">統計データ白書</a>
            <a href="/guide/brand-comparison" class="portal-nav-item{% if nav_active == 'comparison' %} active{% endif %}">3大ブランド比較</a>
            <a href="/grooming" class="portal-nav-item{% if nav_active == 'grooming' %} active{% endif %}">服装・事前準備</a>
        </nav>
        {% if nav_active != 'for_women' %}
        <button type="button" class="portal-nav-item portal-theme-toggle-btn" onclick="window.__togglePortalTheme && window.__togglePortalTheme()" title="明るいライトモードとダークモードを切り替え">
            <span class="portal-theme-btn-text">☀️ ライト</span>
        </button>
        {% endif %}
</div>
        <script>if(window.__syncPortalThemeBtns)window.__syncPortalThemeBtns();</script>
        {% include '_nav_loader.html' %}
