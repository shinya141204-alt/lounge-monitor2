{#- ポータル共通グローバルナビ。
    使い方: {% set nav_active = 'columns' %}{% include '_portal_nav.html' %}
    nav_active: 'ranking' | 'price_comparison' | 'for_women' | 'areas' | 'columns' | 'stats' | 'comparison' | 'grooming'（未指定ならアクティブなし）
    スタイルの共通部分は /static/portal.css、ページ固有の差分は各ページの <style> に記述。 -#}
<script>
(function(){
    try {
        var isWomenPage = document.body.classList.contains('audience-women') || (location.pathname || '').indexOf('/for-women') === 0;
        var wm = isWomenPage ? localStorage.getItem('aiseki_women_manual_theme') : null;
        var gv = localStorage.getItem('olg_view_theme');
        if (isWomenPage) {
            if (window.__aisekiWomenForceDark || wm === 'default' || (wm === null && gv === 'default')) {
                document.documentElement.classList.remove('theme-light');
                document.body.classList.remove('theme-light');
            } else if (wm === 'light' || gv === 'light' || document.body.classList.contains('theme-light')) {
                document.documentElement.classList.add('theme-light');
                document.body.classList.add('theme-light');
            }
        } else if (gv === 'light' || document.documentElement.classList.contains('theme-light')) {
            document.documentElement.classList.add('theme-light');
            document.body.classList.add('theme-light');
        }
    } catch (e) {}
    window.__syncPortalThemeBtns = function() {
        var isLight = document.body.classList.contains('theme-light');
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta && !document.documentElement.hasAttribute('data-theme')) {
            meta.content = isLight ? 'light' : 'dark';
        }
        var nodes = document.querySelectorAll('.portal-theme-btn-text');
        for (var i = 0; i < nodes.length; i++) {
            nodes[i].textContent = isLight ? 'ダーク表示' : 'ライト表示';
        }
    };
    window.__togglePortalTheme = function() {
        var isLight = document.body.classList.toggle('theme-light');
        document.documentElement.classList.toggle('theme-light', isLight);
        try {
            localStorage.setItem('olg_view_theme', isLight ? 'light' : 'default');
            if (document.body.classList.contains('audience-women') || (location.pathname || '').indexOf('/for-women') === 0) {
                localStorage.setItem('aiseki_women_manual_theme', isLight ? 'light' : 'default');
            }
        } catch (e) {}
        window.__syncPortalThemeBtns();
    };
    window.toggleForWomenTheme = window.__togglePortalTheme;
})();
</script>
<div class="portal-global-nav-row">
        <nav class="portal-global-nav" aria-label="メインナビゲーション">
            <a href="/" class="portal-nav-item{% if nav_active == 'ranking' %} active{% endif %}"{% if nav_active == 'ranking' %} aria-current="page"{% endif %}>リアルタイム順位</a>
            <a href="/concierge" class="portal-nav-item{% if nav_active == 'concierge' %} active{% endif %}"{% if nav_active == 'concierge' %} aria-current="page"{% endif %}>穴場診断</a>
            <a href="/for-women" class="portal-nav-item{% if nav_active == 'for_women' %} active{% endif %}"{% if nav_active == 'for_women' %} aria-current="page"{% endif %}>初めての女性向け安心ガイド</a>
            <a href="/price-comparison" class="portal-nav-item{% if nav_active == 'price_comparison' %} active{% endif %}"{% if nav_active == 'price_comparison' %} aria-current="page"{% endif %}>料金・イベント比較</a>
            <a href="/columns" class="portal-nav-item{% if nav_active == 'columns' %} active{% endif %}"{% if nav_active == 'columns' %} aria-current="page"{% endif %}>コラム・記事一覧</a>
            <a href="/areas" class="portal-nav-item{% if nav_active == 'areas' %} active{% endif %}"{% if nav_active == 'areas' %} aria-current="page"{% endif %}>エリアから探す</a>
            <a href="/stats" class="portal-nav-item{% if nav_active == 'stats' %} active{% endif %}"{% if nav_active == 'stats' %} aria-current="page"{% endif %}>統計データ白書</a>
            <a href="/guide/brand-comparison" class="portal-nav-item{% if nav_active == 'comparison' %} active{% endif %}"{% if nav_active == 'comparison' %} aria-current="page"{% endif %}>3大ブランド比較</a>
            <a href="/grooming" class="portal-nav-item{% if nav_active == 'grooming' %} active{% endif %}"{% if nav_active == 'grooming' %} aria-current="page"{% endif %}>服装・事前準備</a>
        </nav>
        <button type="button"{% if nav_active == 'for_women' %} id="for-women-theme-btn"{% endif %} class="portal-nav-item portal-theme-toggle-btn" onclick="{% if nav_active == 'for_women' %}toggleForWomenTheme(){% else %}window.__togglePortalTheme && window.__togglePortalTheme(){% endif %}" title="明るいライトモードとダークモードを切り替え">
            <span class="portal-theme-btn-text">ライト表示</span>
        </button>
</div>
        <script>(function(){if(window.__syncPortalThemeBtns)window.__syncPortalThemeBtns();var n=document.querySelector('.portal-global-nav'),a=n&&n.querySelector('.portal-nav-item.active');function syncNavFade(){if(!n)return;var maxS=Math.max(0,n.scrollWidth-n.clientWidth);n.classList.toggle('can-scroll-left',n.scrollLeft>6);n.classList.toggle('can-scroll-right',maxS>6&&n.scrollLeft<maxS-6);}if(n){if(a&&n.scrollWidth>n.clientWidth){n.scrollLeft=Math.max(0,(a.offsetLeft-n.offsetLeft)-(n.clientWidth-a.offsetWidth)/2);}syncNavFade();n.addEventListener('scroll',syncNavFade,{passive:true});window.addEventListener('resize',syncNavFade,{passive:true});}})();</script>
