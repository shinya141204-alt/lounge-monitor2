{#- ポータル共通グローバルナビ。
    使い方: {% set nav_active = 'columns' %}{% include '_portal_nav.html' %}
    nav_active: 'ranking' | 'price_comparison' | 'for_women' | 'areas' | 'columns' | 'stats' | 'comparison' | 'grooming'（未指定ならアクティブなし）
    スタイルの共通部分は /static/portal.css、ページ固有の差分は各ページの <style> に記述。 -#}
<nav class="portal-global-nav" aria-label="メインナビゲーション">
            <a href="/" class="portal-nav-item{% if nav_active == 'ranking' %} active{% endif %}">リアルタイム順位</a>
            <a href="/for-women" class="portal-nav-item{% if nav_active == 'for_women' %} active{% endif %}">💄 女子向け裏ガイド</a>
            <a href="/price-comparison" class="portal-nav-item{% if nav_active == 'price_comparison' %} active{% endif %}">料金・イベント比較</a>
            <a href="/columns" class="portal-nav-item{% if nav_active == 'columns' %} active{% endif %}">コラム・記事一覧</a>
            <a href="/areas" class="portal-nav-item{% if nav_active == 'areas' %} active{% endif %}">エリアから探す</a>
            <a href="/stats" class="portal-nav-item{% if nav_active == 'stats' %} active{% endif %}">統計データ白書</a>
            <a href="/guide/brand-comparison" class="portal-nav-item{% if nav_active == 'comparison' %} active{% endif %}">3大ブランド比較</a>
            <a href="/grooming" class="portal-nav-item{% if nav_active == 'grooming' %} active{% endif %}">服装・事前準備</a>
        </nav>
        <script>
        (function() {
            if (window.__portalNavFastInit) return;
            window.__portalNavFastInit = true;
            var prefetched = {};
            function isLiveHtmlHref(href) {
                return href === '/' || href.indexOf('/for-women') === 0 || href.indexOf('/price-comparison') === 0 || href.indexOf('/areas') === 0 || href.indexOf('/area/') === 0 || href.indexOf('/store/') === 0;
            }
            function prefetchUrl(href, allowLive) {
                if (!href || prefetched[href] || href.indexOf('/') !== 0) return;
                if (!allowLive && isLiveHtmlHref(href)) return;
                prefetched[href] = true;
                try {
                    var link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = href;
                    link.as = 'document';
                    document.head.appendChild(link);
                } catch (e) {}
            }
            document.addEventListener('pointerdown', function(e) {
                var a = e.target && e.target.closest ? e.target.closest('.portal-nav-item, .portal-nav-link, .area-pill') : null;
                if (a) prefetchUrl(a.getAttribute('href'), true);
            }, { passive: true });
            document.addEventListener('mouseover', function(e) {
                var a = e.target && e.target.closest ? e.target.closest('.portal-nav-item, .portal-nav-link') : null;
                if (a) prefetchUrl(a.getAttribute('href'), true);
            }, { passive: true });
            document.addEventListener('click', function(e) {
                if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                var a = e.target && e.target.closest ? e.target.closest('.portal-nav-item, .portal-nav-link, .menu-grid-item[href], .area-pill') : null;
                if (!a) return;
                var href = a.getAttribute('href');
                if (!href || href.indexOf('#') === 0 || a.target === '_blank') return;
                if (href === window.location.pathname + window.location.search) return;
                a.classList.add('nav-loading');
            });
            window.addEventListener('pageshow', function() {
                document.querySelectorAll('.nav-loading').forEach(function(el) { el.classList.remove('nav-loading'); });
            });
            if ('requestIdleCallback' in window) {
                requestIdleCallback(function() {
                    ['/guide/brand-comparison', '/columns', '/grooming', '/stats'].forEach(function(u) { prefetchUrl(u, false); });
                }, { timeout: 2500 });
            }
        })();
        </script>
