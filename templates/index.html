<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OLG Monitor</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Analysis Modal -->
    <div id="analysis-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()" aria-label="閉じる">&times;</button>
            <h2 id="modal-store-name">Store Name</h2>

            <div class="chart-container">
                <!-- Weekday Average Section -->
                <div class="chart-container weekday-analysis-section">
                    <h3>曜日別平均 (Weekday Average)</h3>
                    <div id="weekday-chart-container" style="height: 200px; margin-bottom: 20px;">
                        <canvas id="weekdayChart"></canvas>
                    </div>
                </div>
                
                <hr style="border: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">

                <!-- Daily Detail Section -->
                <div class="chart-container daily-detail-section">
                    <h3>日別詳細 (Daily Detail)</h3>
                    <div id="date-buttons" class="date-button-container">
                        <!-- Date buttons will be generated by JS -->
                    </div>
                    <div id="daily-chart-container" class="hidden">
                        <canvas id="dailyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Analysis Modal -->

    <!-- Comparison Modal -->
    <div id="comparison-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeComparisonModal()" aria-label="閉じる">&times;</button>
            <h2>競合比較 (Brand Comparison)</h2>
            <p style="text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: -10px; margin-bottom: 20px;">
                現在の来店数（ブランド合計）
            </p>
            <div class="chart-container" style="height: 350px;">
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>
    </div>
    <!-- End Comparison Modal -->

    <!-- Report Modal -->
    <div id="report-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-btn" onclick="closeReportModal()" aria-label="閉じる">&times;</button>
            <h2>週間レポート (Weekly Report)</h2>
            <p id="report-period" style="text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: -10px; margin-bottom: 20px;">
                Loading...
            </p>
            <div id="report-content" class="chart-container" style="overflow-x: auto;">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
    <!-- End Report Modal -->

    <div class="background-glob"></div>
    <div class="background-glob glob-2"></div>

    <div class="container">
        <header>
            <h1>OLG MONITOR</h1>
            <p class="subtitle">Live Ranking Update</p>
            <div class="header-controls">
                <button id="report-btn" class="header-btn" onclick="openReportModal()" title="週間レポート">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line>
                    </svg>
                </button>
                <button id="compare-btn" class="header-btn" onclick="openComparisonModal()" title="競合比較ダッシュボード">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </button>
                <button id="compact-btn" class="header-btn" onclick="toggleCompact()" title="コンパクト表示切替">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
                <button id="refresh-btn" class="header-btn refresh-btn" onclick="manualRefresh()" title="データを更新">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                    </svg>
                </button>
            </div>
        </header>

        <main>
            <div id="pull-indicator">
                <div class="spinner"></div>
            </div>
            
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <p>Establishing Connection...</p>
            </div>

            <div id="content" class="content hidden">

                <div class="search-sort-container">
                    <input type="text" id="search-input" placeholder="店舗名を検索..." oninput="handleSearch(this.value)">
                    <div class="sort-controls">
                        <button class="sort-btn active" data-sort="women" onclick="setSort('women')">女性順</button>
                        <button class="sort-btn" data-sort="men" onclick="setSort('men')">男性順</button>
                        <button class="sort-btn" data-sort="ratio" onclick="setSort('ratio')">男女比</button>
                    </div>
                </div>

                <div class="filter-bar">
                    <button class="filter-btn active" data-region="All">全て</button>
                    <button class="filter-btn" data-region="Kanto">関東</button>
                    <button class="filter-btn" data-region="Kinki">関西</button>
                    <button class="filter-btn" data-region="Chubu">中部</button>
                    <button class="filter-btn" data-region="Kyushu">九州</button>
                    <button class="filter-btn" data-region="Hokkaido">北海道</button>
                    <button class="filter-btn" data-region="Tohoku">東北</button>
                    <button class="filter-btn" data-region="Chugoku">中国</button>
                    <button class="filter-btn" data-region="Shikoku">四国</button>
                    <button class="filter-btn" data-region="Korea">韓国</button>
                </div>

                <!-- Pinned Stores Section -->
                <div id="pinned-list-container" class="hidden">
                    <h2 class="section-title">PINNED STORES</h2>
                    <div id="pinned-list" class="ranking-list">
                        <!-- Pinned items will populate here -->
                    </div>
                    <div class="separator"></div>
                </div>

                <div id="ranking-list" class="ranking-list">
                    <!-- Javascript will populate this -->
                </div>

                <div class="info-bar">
                    <p>Last Update: <span id="last-update">--:--</span></p>

                    <div class="live-indicator">
                        <div class="dot"></div>
                        LIVE (1m)
                    </div>
                </div>
            </div>

            <div id="error-message" class="error-message hidden">
                <p>Failed to retrieve data.</p>
            </div>
        </main>
    </div>

    <!-- Template for ranking item -->
    <template id="ranking-item-template">
        <div class="ranking-item">
            <div class="rank-badge">1</div>
            <div class="store-info">
                <h3 class="store-name">Store Name</h3>
            </div>
            <!-- Card Actions -->
            <div class="card-actions">
                <button class="pin-btn" aria-label="Pin Store" title="お気に入り">
                    <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                        </polygon>
                    </svg>
                </button>
                <button class="analysis-btn" aria-label="Analyze Store" title="詳細分析">
                    <svg class="chart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </button>
            </div>
            <div class="stats-group">
                <div class="stat ladies">
                    <span class="count">0</span>
                    <span class="label">LADIES</span>
                </div>
                <div class="stat men">
                    <span class="count">0</span>
                    <span class="label">MEN</span>
                </div>
            </div>
            <!-- Progress bar visual -->
            <div class="occupancy-bar">
                <div class="bar-fill"></div>
            </div>
        </div>
    </template>

    <script>
        let currentFilter = 'All';
        let currentSearch = '';
        let currentSort = 'women';
        let isCompact = localStorage.getItem('olg_compact_view') === 'true';
        let pinnedStores = JSON.parse(localStorage.getItem('olg_pinned_stores')) || [];

        // Apply compact view immediately if set
        if (isCompact) {
            document.body.classList.add('compact-mode');
        }

        // Save Pinned Stores
        function togglePin(storeName) {
            if (pinnedStores.includes(storeName)) {
                pinnedStores = pinnedStores.filter(name => name !== storeName);
            } else {
                pinnedStores.push(storeName);
            }
            localStorage.setItem('olg_pinned_stores', JSON.stringify(pinnedStores));

            // Re-render immediately
            if (window.lastData) {
                updateUI(window.lastData);
            }
        }

        function handleSearch(query) {
            currentSearch = query.toLowerCase();
            if (window.lastData) updateUI(window.lastData);
        }

        function setSort(sortType) {
            currentSort = sortType;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.sort-btn[data-sort="${sortType}"]`).classList.add('active');
            if (window.lastData) updateUI(window.lastData);
        }

        function toggleCompact() {
            isCompact = !isCompact;
            localStorage.setItem('olg_compact_view', isCompact);
            if (isCompact) {
                document.body.classList.add('compact-mode');
            } else {
                document.body.classList.remove('compact-mode');
            }
        }

        // Add filter button listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                // Add active to clicked
                e.target.classList.add('active');

                currentFilter = e.target.dataset.region;

                // Re-render with cached data if available (or wait for next fetch)
                if (window.lastData) {
                    updateUI(window.lastData);
                }
            });
        });

        let isInitialLoad = true;

        async function fetchWithTimeout(url, timeoutMs = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                return response;
            } catch (e) {
                clearTimeout(timer);
                throw e;
            }
        }

        async function fetchData() {
            try {
                const response = await fetchWithTimeout('/api/status', 15000);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.status === 'loading') {
                    // Server just started, data not ready yet - show message and retry
                    const loadingMsg = document.getElementById('loading').querySelector('p');
                    if (loadingMsg) {
                        if (!window._loadRetryCount) window._loadRetryCount = 0;
                        window._loadRetryCount++;
                        const dots = '.'.repeat((window._loadRetryCount % 3) + 1);
                        const elapsed = window._loadRetryCount * 3;
                        if (elapsed < 15) {
                            loadingMsg.textContent = `サーバー起動中${dots} まもなくデータを取得します`;
                        } else if (elapsed < 45) {
                            loadingMsg.textContent = `データ取得中${dots} もうしばらくお待ちください`;
                        } else {
                            loadingMsg.textContent = `接続に時間がかかっています${dots} 自動でリトライ中`;
                        }
                    }
                    setTimeout(fetchData, 3000);
                    return;
                }

                if (data.error || data.status !== 'success') {
                    const list = document.getElementById('ranking-list');
                    if (list.children.length === 0) {
                        showError();
                    }
                    return;
                }

                isInitialLoad = false;
                window.lastData = data;
                updateUI(data);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('error-message').classList.add('hidden');
            } catch (e) {
                console.error("Fetch error:", e);
                if (isInitialLoad) {
                    // Show retry message and auto-retry
                    const loadingEl = document.getElementById('loading');
                    const loadingMsg = loadingEl.querySelector('p');
                    if (loadingMsg) {
                        loadingMsg.textContent = 'サーバー起動中... 再接続しています';
                    }
                    setTimeout(fetchData, 3000);
                } else {
                    // After initial load, silently ignore (keep showing old data)
                    console.warn("Background fetch failed, keeping existing data");
                }
            }
        }

        async function manualRefresh() {
            const btn = document.getElementById('refresh-btn');
            if (btn.disabled) return;
            
            btn.disabled = true;
            btn.classList.add('spinning');
            
            await fetchData();
            
            setTimeout(() => {
                btn.classList.remove('spinning');
                btn.disabled = false;
            }, 500);
        }

        function renderStore(store, index, container, isPinned = false, globalIndex = null) {
            const template = document.getElementById('ranking-item-template');
            const node = template.content.cloneNode(true);
            const item = node.querySelector('.ranking-item');

            // If pinned, add active class to button
            const pinBtn = node.querySelector('.pin-btn');
            if (pinnedStores.includes(store.name)) {
                pinBtn.classList.add('active');
            }

            // Pin click handler
            pinBtn.onclick = (e) => {
                e.stopPropagation(); // prevent card click
                togglePin(store.name);
            };

            // Analysis button handler
            const analysisBtn = node.querySelector('.analysis-btn');
            analysisBtn.onclick = (e) => {
                e.stopPropagation();
                openModal(store.name);
            };

            // Card click handler (Open Analysis)
            item.style.cursor = 'pointer';
            item.onclick = () => openModal(store.name);

            // Rank logic
            // If globalIndex is provided, use it (for relative rank in main list)
            // If pinned, maybe show a star badge or just the original rank?
            // Let's use the index passed in + 1
            const displayRank = globalIndex !== null ? globalIndex + 1 : index + 1;

            // Add top 3 special classes only if NOT pinned section (or keep consistent?)
            // If it's the main list, show colors.
            if (!isPinned) {
                if (index === 0) item.classList.add('rank-1');
                if (index === 1) item.classList.add('rank-2');
                if (index === 2) item.classList.add('rank-3');
            } else {
                item.classList.add('pinned-item');
            }

            node.querySelector('.rank-badge').textContent = displayRank;
            node.querySelector('.store-name').textContent = store.name;

            const ladiesCount = store.women;
            const menCount = store.men;

            node.querySelector('.stat.ladies .count').textContent = ladiesCount;
            node.querySelector('.stat.men .count').textContent = menCount;

            // Bar calculation (relative to max in filtered list, or global max?)
            // We'll approximate using window.maxLadies from main loop
            if (window.currentMaxLadies) {
                const percentage = Math.min(100, (ladiesCount / window.currentMaxLadies) * 100);
                node.querySelector('.bar-fill').style.width = percentage + '%';
            }

            container.appendChild(node);
        }

        function updateUI(data) {
            const rankingList = document.getElementById('ranking-list');
            const pinnedList = document.getElementById('pinned-list');
            const pinnedContainer = document.getElementById('pinned-list-container');

            // Clear lists
            rankingList.innerHTML = '';
            pinnedList.innerHTML = '';

            const stores = data.ranking;
            if (!stores || stores.length === 0) return;

            // Filter stores based on current region and search
            let filteredStores = stores.filter(store => {
                const matchRegion = currentFilter === 'All' || store.region === currentFilter;
                const matchSearch = currentSearch === '' || store.name.toLowerCase().includes(currentSearch);
                return matchRegion && matchSearch;
            });

            // Apply Sorting
            if (currentSort === 'men') {
                filteredStores.sort((a, b) => b.men - a.men);
            } else if (currentSort === 'ratio') {
                filteredStores.sort((a, b) => {
                    const ratioA = a.men === 0 ? a.women : (a.women / a.men);
                    const ratioB = b.men === 0 ? b.women : (b.women / b.men);
                    return ratioB - ratioA; // Descending ratio (women heavy)
                });
            } else {
                // Default 'women'
                filteredStores.sort((a, b) => b.women - a.women);
            }

            if (filteredStores.length === 0) {
                rankingList.innerHTML = '<p style="color: #666; width: 100%; text-align: center;">No stores found in this region.</p>';
                pinnedContainer.classList.add('hidden');
                return;
            }

            // Calculate max ladies for bar width relative to this view
            window.currentMaxLadies = filteredStores[0].women || 1;

            // Separate Pinned vs Others
            // We want Pinned stores to appear at the top, BUT we also want to separate them visually.
            // AND we need to decide: do pinned stores disappear from the main list?
            // User request: "Pinning makes it stay at the top". duplicate is safer contextually, but removing from list is cleaner.
            // Let's remove from main list to avoid duplicates, as they are "moved" to top.

            const pinnedItems = [];
            const otherItems = [];

            // We need to preserve the original rank index for display!

            filteredStores.forEach((store, realIndex) => {
                if (pinnedStores.includes(store.name)) {
                    pinnedItems.push({ store, rank: realIndex });
                } else {
                    otherItems.push({ store, rank: realIndex });
                }
            });

            // Render Pinned
            if (pinnedItems.length > 0) {
                pinnedContainer.classList.remove('hidden');
                pinnedItems.forEach(item => {
                    renderStore(item.store, -1, pinnedList, true, item.rank);
                });
            } else {
                pinnedContainer.classList.add('hidden');
            }

            // Render Others
            otherItems.forEach((item, index) => {
                // index here is position in 'otherItems', but we want style based on position?
                // Actually the rank styles (gold/silver/bronze) are usually about being 1st/2nd/3rd.
                // If the 1st store is pinned, does the 2nd store become Gold? No, that would be confusing.
                // We should pass the actual index (0, 1, 2) in the visual list for coloring?
                // OR we strictly follow the 'realIndex' (Global Rank) for coloring.
                // Let's stick to Global Rank for coloring so it matches the number.

                // Correction: The `renderStore` logic uses `index` for class adding.
                // If we want the style to match the badge, we should check `item.rank`.

                renderStore(item.store, item.rank, rankingList, false, item.rank);
            });

            document.getElementById('last-update').textContent = data.timestamp ? data.timestamp.split(' ')[1].substring(0, 5) : '--:--';
        }

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
        }

        // Initial fetch
        fetchData();

        // Poll every 30 seconds
        setInterval(fetchData, 30000);

        // --- Analysis Modal Logic ---
        let hourlyChartInstance = null;
        let weekdayChartInstance = null;
        let currentAnalysisData = null;

        async function openModal(storeName) {
            const modal = document.getElementById('analysis-modal');
            const title = document.getElementById('modal-store-name');
            title.textContent = storeName + " Loading...";
            modal.classList.remove('hidden');

            // Reset filters UI
            // Filters removed for Trend View

            try {
                const response = await fetch('/api/analysis/' + encodeURIComponent(storeName));
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.error) {
                    title.textContent = "Error: " + data.error;
                    return;
                }

                title.textContent = data.store_name;
                currentAnalysisData = data;
                renderCharts(data);

            } catch (e) {
                console.error(e);
                title.textContent = "Network Error";
            }
        }

        function closeModal() {
            document.getElementById('analysis-modal').classList.add('hidden');
            if (dailyChartInstance) { dailyChartInstance.destroy(); dailyChartInstance = null; }
            if (weekdayAnalysisChartInstance) { weekdayAnalysisChartInstance.destroy(); weekdayAnalysisChartInstance = null; }
            currentAnalysisData = null;
        }

        // Close on clicking background
        document.getElementById('analysis-modal').addEventListener('click', (e) => {
            if (e.target.id === ('analysis-modal')) closeModal();
        });
        document.getElementById('comparison-modal').addEventListener('click', (e) => {
            if (e.target.id === ('comparison-modal')) closeComparisonModal();
        });

        // --- Comparison Modal Logic ---
        let comparisonChartInstance = null;

        function openComparisonModal() {
            if (!window.lastData || !window.lastData.ranking) return;
            
            const modal = document.getElementById('comparison-modal');
            modal.classList.remove('hidden');

            const brandTotals = {};
            
            // Only aggregate from filteredStores if we want regional comparison, or all stores?
            // Let's use the current filter so users can compare specific regions (e.g. Kyushu OLG vs JIS)
            let storesToCompare = window.lastData.ranking;
            if (currentFilter !== 'All') {
                storesToCompare = storesToCompare.filter(s => s.region === currentFilter);
            }

            storesToCompare.forEach(store => {
                const brand = (store.source || 'Unknown').toUpperCase();
                if (!brandTotals[brand]) {
                    brandTotals[brand] = { women: 0, men: 0, count: 0 };
                }
                brandTotals[brand].women += store.women;
                brandTotals[brand].men += store.men;
                brandTotals[brand].count += 1;
            });

            // Sort by total ladies descending
            const brands = Object.keys(brandTotals).sort((a, b) => brandTotals[b].women - brandTotals[a].women);
            
            const labels = brands.map(b => `${b} (${brandTotals[b].count}店舗)`);
            const womenData = brands.map(b => brandTotals[b].women);
            const menData = brands.map(b => brandTotals[b].men);

            if (comparisonChartInstance) {
                comparisonChartInstance.destroy();
            }

            const ctx = document.getElementById('comparisonChart').getContext('2d');
            comparisonChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Ladies',
                            data: womenData,
                            backgroundColor: 'rgba(255, 107, 107, 0.8)',
                            borderRadius: 4
                        },
                        {
                            label: 'Men',
                            data: menData,
                            backgroundColor: 'rgba(77, 171, 247, 0.8)',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: false, grid: { display: false } },
                        y: { stacked: false, grid: { color: 'rgba(255,255,255,0.1)' } }
                    },
                    plugins: {
                        legend: { display: true, labels: { color: '#fff' } }
                    }
                }
            });
        }

        function closeComparisonModal() {
            document.getElementById('comparison-modal').classList.add('hidden');
            if (comparisonChartInstance) { comparisonChartInstance.destroy(); comparisonChartInstance = null; }
        }

        // --- Weekly Report Modal Logic ---
        async function openReportModal() {
            const modal = document.getElementById('report-modal');
            const content = document.getElementById('report-content');
            const period = document.getElementById('report-period');
            
            modal.classList.remove('hidden');
            content.innerHTML = '<div class="spinner"></div>';
            period.textContent = 'Loading...';

            try {
                const response = await fetch('/api/weekly-report');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.status !== 'success') {
                    content.innerHTML = `<p style="color: var(--accent-red); text-align: center;">Error: ${data.error}</p>`;
                    return;
                }

                const report = data.data;
                period.textContent = report.period;

                // Build HTML Table for Report
                let html = `
                    <h3 style="margin-top: 0;">ブランド別サマリー</h3>
                    <table class="report-table">
                        <tr>
                            <th>Brand</th>
                            <th>店舗数</th>
                            <th>平均 女性</th>
                            <th>平均 男性</th>
                        </tr>
                `;
                for (const [brand, stats] of Object.entries(report.by_brand)) {
                    html += `
                        <tr>
                            <td>${brand}</td>
                            <td>${stats.store_count}</td>
                            <td>${stats.total_avg_women}</td>
                            <td>${stats.total_avg_men}</td>
                        </tr>
                    `;
                }
                html += `</table>
                    <h3 style="margin-top: 20px;">店舗別ランキング</h3>
                    <table class="report-table">
                        <tr>
                            <th>店舗名</th>
                            <th>Brand</th>
                            <th>平均 女性</th>
                            <th>平均 男性</th>
                            <th>ピーク時 女性</th>
                            <th>ピーク時間</th>
                            <th>営業日数</th>
                        </tr>
                `;
                report.stores.forEach(store => {
                    html += `
                        <tr>
                            <td>${store.name}</td>
                            <td>${store.brand}</td>
                            <td>${store.avg_women}</td>
                            <td>${store.avg_men}</td>
                            <td>${store.max_women}</td>
                            <td>${store.peak_hour}</td>
                            <td>${store.days_with_data}</td>
                        </tr>
                    `;
                });
                html += '</table>';
                content.innerHTML = html;

            } catch (e) {
                console.error(e);
                content.innerHTML = '<p style="color: var(--accent-red); text-align: center;">Failed to load report.</p>';
            }
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
        }

        document.getElementById('report-modal').addEventListener('click', (e) => {
            if (e.target.id === ('report-modal')) closeReportModal();
        });

        function renderCharts(data) {
            // Render Weekday Chart
            renderWeekdayChart(data);
            
            // Generate date buttons and daily chart
            generateDateButtons(data);
        }

        let dailyChartInstance = null;
        let weekdayAnalysisChartInstance = null;
        let allDates = [];
        let visibleDateCount = 7;
        let currentData = null;
        
        function renderWeekdayChart(data) {
            if (weekdayAnalysisChartInstance) {
                weekdayAnalysisChartInstance.destroy();
            }
            const ctx = document.getElementById('weekdayChart').getContext('2d');
            
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const displayDays = ['月', '火', '水', '木', '金', '土', '日'];
            
            const womenData = days.map(d => data.weekday[d] || 0);
            const menData = days.map(d => data.weekday_men ? (data.weekday_men[d] || 0) : 0);

            weekdayAnalysisChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: displayDays,
                    datasets: [
                        {
                            label: 'Ladies',
                            data: womenData,
                            backgroundColor: 'rgba(255, 107, 107, 0.8)',
                            borderRadius: 4
                        },
                        {
                            label: 'Men',
                            data: menData,
                            backgroundColor: 'rgba(77, 171, 247, 0.8)',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } }
                    },
                    plugins: {
                        legend: { display: true, labels: { color: '#fff' } }
                    }
                }
            });
        }

        function generateDateButtons(data) {
            currentData = data;
            const container = document.getElementById('date-buttons');
            container.innerHTML = '';

            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

            // Get unique dates from recent_trend data
            const dates = new Set();
            (data.recent_trend || []).forEach(d => {
                const dateStr = d.x.split(' ')[0]; // "2024-01-28"
                dates.add(dateStr);
            });

            // Sort dates descending (newest first)
            allDates = Array.from(dates).sort().reverse();
            visibleDateCount = 7; // Reset to first 7

            renderDateButtons();
        }

        function renderDateButtons() {
            const container = document.getElementById('date-buttons');
            container.innerHTML = '';
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

            // Show only visible dates
            const visibleDates = allDates.slice(0, visibleDateCount);

            visibleDates.forEach(dateStr => {
                const parts = dateStr.split('-');
                const date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                const dayName = dayNames[date.getDay()];

                const btn = document.createElement('button');
                btn.className = 'date-btn';
                btn.innerHTML = `${parts[1]}/${parts[2]}<span class="day-name">${dayName}</span>`;
                btn.onclick = (e) => showDailyChart(dateStr, currentData, e);
                container.appendChild(btn);
            });

            // Add 'Load More' button if there are more dates
            if (allDates.length > visibleDateCount) {
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.className = 'date-btn load-more-btn';
                loadMoreBtn.innerHTML = `もっと見る<span class="day-name">+${allDates.length - visibleDateCount}</span>`;
                loadMoreBtn.onclick = () => {
                    visibleDateCount += 7;
                    renderDateButtons();
                };
                container.appendChild(loadMoreBtn);
            }
        }

        function showDailyChart(dateStr, data, evt) {
            // Update active button state
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            if (evt && evt.target) evt.target.closest('.date-btn').classList.add('active');

            // Show chart container
            document.getElementById('daily-chart-container').classList.remove('hidden');

            // Filter data for selected date
            const womenData = (data.recent_trend || []).filter(d => d.x.startsWith(dateStr));
            const menData = (data.recent_trend_men || []).filter(d => d.x.startsWith(dateStr));

            // Create labels (time only)
            const labels = womenData.map(d => {
                const timeParts = d.x.split(' ')[1].split(':');
                return `${timeParts[0]}:${timeParts[1]}`;
            });
            const womenValues = womenData.map(d => d.y);
            const menValues = menData.map(d => d.y);

            if (dailyChartInstance) dailyChartInstance.destroy();

            const ctx = document.getElementById('dailyChart').getContext('2d');
            dailyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Ladies',
                            data: womenValues,
                            backgroundColor: 'rgba(255, 107, 107, 0.2)',
                            borderColor: 'rgba(255, 107, 107, 1)',
                            borderWidth: 1.5,
                            pointRadius: 2,
                            fill: true,
                            tension: 0.1
                        },
                        {
                            label: 'Men',
                            data: menValues,
                            backgroundColor: 'rgba(77, 171, 247, 0.2)',
                            borderColor: 'rgba(77, 171, 247, 1)',
                            borderWidth: 1.5,
                            pointRadius: 2,
                            fill: true,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: {
                            grid: { display: false },
                            ticks: {
                                maxTicksLimit: 12,
                                maxRotation: 0,
                                autoSkip: true
                            }
                        }
                    },
                    plugins: {
                        legend: { display: true, labels: { color: '#fff' } },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // Pull to refresh logic
        let touchstartY = 0;
        let touchendY = 0;
        const pullThreshold = 80;
        let isPulling = false;

        const pullIndicator = document.getElementById('pull-indicator');

        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) {
                touchstartY = e.changedTouches[0].screenY;
                isPulling = true;
            }
        }, {passive: true});

        document.addEventListener('touchmove', e => {
            if (!isPulling) return;
            const y = e.changedTouches[0].screenY;
            if (y > touchstartY + pullThreshold) {
                pullIndicator.classList.add('show');
            } else {
                pullIndicator.classList.remove('show');
            }
        }, {passive: true});

        document.addEventListener('touchend', e => {
            if (!isPulling) return;
            touchendY = e.changedTouches[0].screenY;
            isPulling = false;
            
            if (touchendY > touchstartY + pullThreshold && window.scrollY === 0) {
                // Trigger refresh
                manualRefresh();
                setTimeout(() => {
                    pullIndicator.classList.remove('show');
                }, 1000); // Hide after a bit
            } else {
                pullIndicator.classList.remove('show');
            }
        });
    </script>
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed:', error));
            });
        }
    </script>
