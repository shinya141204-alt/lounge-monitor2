<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLG Monitor</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Analysis Modal -->
    <div id="analysis-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modal-store-name">Store Name</h2>

            <div class="chart-container">
                <h3>時間帯別 (Business Hours)</h3>

                <!-- Filters -->
                <div class="chart-filters">
                    <button class="chart-filter-btn active" onclick="updateHourlyChart('All')">All</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Mon')">月</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Tue')">火</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Wed')">水</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Thu')">木</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Fri')">金</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Sat')">土</button>
                    <button class="chart-filter-btn" onclick="updateHourlyChart('Sun')">日</button>
                </div>

                <canvas id="hourlyChart"></canvas>
            </div>

            <div class="chart-container">
                <h3>曜日別 (Weekly)</h3>
                <canvas id="weekdayChart"></canvas>
            </div>
        </div>
    </div>

    <div class="background-glob"></div>
    <div class="background-glob glob-2"></div>

    <div class="container">
        <header>
            <h1>OLG MONITOR</h1>
            <p class="subtitle">Live Ranking Update</p>
        </header>

        <main>
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <p>Establishing Connection...</p>
            </div>

            <div id="content" class="content hidden">


                <div class="filter-bar">
                    <button class="filter-btn active" data-region="All">全て</button>
                    <button class="filter-btn" data-region="Kanto">関東</button>
                    <button class="filter-btn" data-region="Kinki">関西</button>
                    <button class="filter-btn" data-region="Chubu">中部</button>
                    <button class="filter-btn" data-region="Kyushu">九州</button>
                    <button class="filter-btn" data-region="Hokkaido">北海道</button>
                    <button class="filter-btn" data-region="Tohoku">東北</button>
                    <button class="filter-btn" data-region="Chugoku">中国</button>
                    <button class="filter-btn" data-region="Shikoku">四国</button>
                    <button class="filter-btn" data-region="Korea">韓国</button>
                </div>

                <!-- Pinned Stores Section -->
                <div id="pinned-list-container" class="hidden">
                    <h2 class="section-title">PINNED STORES</h2>
                    <div id="pinned-list" class="ranking-list">
                        <!-- Pinned items will populate here -->
                    </div>
                    <div class="separator"></div>
                </div>

                <div id="ranking-list" class="ranking-list">
                    <!-- Javascript will populate this -->
                </div>

                <div class="info-bar">
                    <p>Last Update: <span id="last-update">--:--</span></p>
                    <div class="live-indicator">
                        <div class="dot"></div>
                        LIVE (1m)
                    </div>
                </div>
            </div>

            <div id="error-message" class="error-message hidden">
                <p>Failed to retrieve data.</p>
            </div>
        </main>
    </div>

    <!-- Template for ranking item -->
    <template id="ranking-item-template">
        <div class="ranking-item">
            <div class="rank-badge">1</div>
            <div class="store-info">
                <h3 class="store-name">Store Name</h3>
            </div>
            <!-- Pin Button Code -->
            <button class="pin-btn" aria-label="Pin Store">
                <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                    </polygon>
                </svg>
            </button>
            <div class="stats-group">
                <div class="stat ladies">
                    <span class="count">0</span>
                    <span class="label">LADIES</span>
                </div>
                <div class="stat men">
                    <span class="count">0</span>
                    <span class="label">MEN</span>
                </div>
            </div>
            <!-- Progress bar visual -->
            <div class="occupancy-bar">
                <div class="bar-fill"></div>
            </div>
        </div>
    </template>

    <script>
        let currentFilter = 'All';
        let pinnedStores = JSON.parse(localStorage.getItem('olg_pinned_stores')) || [];

        // Save Pinned Stores
        function togglePin(storeName) {
            if (pinnedStores.includes(storeName)) {
                pinnedStores = pinnedStores.filter(name => name !== storeName);
            } else {
                pinnedStores.push(storeName);
            }
            localStorage.setItem('olg_pinned_stores', JSON.stringify(pinnedStores));

            // Re-render immediately
            if (window.lastData) {
                updateUI(window.lastData);
            }
        }

        // Add filter button listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                // Add active to clicked
                e.target.classList.add('active');

                currentFilter = e.target.dataset.region;

                // Re-render with cached data if available (or wait for next fetch)
                if (window.lastData) {
                    updateUI(window.lastData);
                }
            });
        });

        async function fetchData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.error || data.status !== 'success') {
                    // Only show error screen if we have NO previous data
                    const list = document.getElementById('ranking-list');
                    if (list.children.length === 0) {
                        showError();
                    }
                    return;
                }

                window.lastData = data; // Cache data for filtering
                updateUI(data);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('error-message').classList.add('hidden');
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        function renderStore(store, index, container, isPinned = false, globalIndex = null) {
            const template = document.getElementById('ranking-item-template');
            const node = template.content.cloneNode(true);
            const item = node.querySelector('.ranking-item');

            // If pinned, add active class to button
            const pinBtn = node.querySelector('.pin-btn');
            if (pinnedStores.includes(store.name)) {
                pinBtn.classList.add('active');
            }

            // Pin click handler
            pinBtn.onclick = (e) => {
                e.stopPropagation(); // prevent card click
                togglePin(store.name);
            };

            // Card click handler (Open Analysis)
            item.style.cursor = 'pointer';
            item.onclick = () => openModal(store.name);

            // Rank logic
            // If globalIndex is provided, use it (for relative rank in main list)
            // If pinned, maybe show a star badge or just the original rank?
            // Let's use the index passed in + 1
            const displayRank = globalIndex !== null ? globalIndex + 1 : index + 1;

            // Add top 3 special classes only if NOT pinned section (or keep consistent?)
            // If it's the main list, show colors.
            if (!isPinned) {
                if (index === 0) item.classList.add('rank-1');
                if (index === 1) item.classList.add('rank-2');
                if (index === 2) item.classList.add('rank-3');
            } else {
                item.classList.add('pinned-item');
            }

            node.querySelector('.rank-badge').textContent = displayRank;
            node.querySelector('.store-name').textContent = store.name;

            const ladiesCount = store.women;
            const menCount = store.men;

            node.querySelector('.stat.ladies .count').textContent = ladiesCount;
            node.querySelector('.stat.men .count').textContent = menCount;

            // Bar calculation (relative to max in filtered list, or global max?)
            // We'll approximate using window.maxLadies from main loop
            if (window.currentMaxLadies) {
                const percentage = Math.min(100, (ladiesCount / window.currentMaxLadies) * 100);
                node.querySelector('.bar-fill').style.width = percentage + '%';
            }

            container.appendChild(node);
        }

        function updateUI(data) {
            const rankingList = document.getElementById('ranking-list');
            const pinnedList = document.getElementById('pinned-list');
            const pinnedContainer = document.getElementById('pinned-list-container');

            // Clear lists
            rankingList.innerHTML = '';
            pinnedList.innerHTML = '';

            const stores = data.ranking;
            if (!stores || stores.length === 0) return;

            // Filter stores based on current region
            const filteredStores = stores.filter(store => {
                if (currentFilter === 'All') return true;
                return store.region === currentFilter;
            });

            if (filteredStores.length === 0) {
                rankingList.innerHTML = '<p style="color: #666; width: 100%; text-align: center;">No stores found in this region.</p>';
                pinnedContainer.classList.add('hidden');
                return;
            }

            // Calculate max ladies for bar width relative to this view
            window.currentMaxLadies = filteredStores[0].women || 1;

            // Separate Pinned vs Others
            // We want Pinned stores to appear at the top, BUT we also want to separate them visually.
            // AND we need to decide: do pinned stores disappear from the main list?
            // User request: "Pinning makes it stay at the top". duplicate is safer contextually, but removing from list is cleaner.
            // Let's remove from main list to avoid duplicates, as they are "moved" to top.

            const pinnedItems = [];
            const otherItems = [];

            // We need to preserve the original rank index for display!

            filteredStores.forEach((store, realIndex) => {
                if (pinnedStores.includes(store.name)) {
                    pinnedItems.push({ store, rank: realIndex });
                } else {
                    otherItems.push({ store, rank: realIndex });
                }
            });

            // Render Pinned
            if (pinnedItems.length > 0) {
                pinnedContainer.classList.remove('hidden');
                pinnedItems.forEach(item => {
                    renderStore(item.store, -1, pinnedList, true, item.rank);
                });
            } else {
                pinnedContainer.classList.add('hidden');
            }

            // Render Others
            otherItems.forEach((item, index) => {
                // index here is position in 'otherItems', but we want style based on position?
                // Actually the rank styles (gold/silver/bronze) are usually about being 1st/2nd/3rd.
                // If the 1st store is pinned, does the 2nd store become Gold? No, that would be confusing.
                // We should pass the actual index (0, 1, 2) in the visual list for coloring?
                // OR we strictly follow the 'realIndex' (Global Rank) for coloring.
                // Let's stick to Global Rank for coloring so it matches the number.

                // Correction: The `renderStore` logic uses `index` for class adding.
                // If we want the style to match the badge, we should check `item.rank`.

                renderStore(item.store, item.rank, rankingList, false, item.rank);
            });

            document.getElementById('last-update').textContent = data.timestamp ? data.timestamp.split(' ')[1].substring(0, 5) : '--:--';
        }

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
        }

        // Initial fetch
        fetchData();

        // Poll every 30 seconds
        setInterval(fetchData, 30000);

        // --- Analysis Modal Logic ---
        let hourlyChartInstance = null;
        let weekdayChartInstance = null;
        let currentAnalysisData = null;

        async function openModal(storeName) {
            const modal = document.getElementById('analysis-modal');
            const title = document.getElementById('modal-store-name');
            title.textContent = storeName + " Loading...";
            modal.classList.remove('hidden');

            // Reset filters UI
            document.querySelectorAll('.chart-filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.chart-filter-btn').classList.add('active'); // Select 'All'

            try {
                const response = await fetch('/api/analysis/' + encodeURIComponent(storeName));
                const data = await response.json();

                if (data.error) {
                    title.textContent = "Error: " + data.error;
                    return;
                }

                title.textContent = data.store_name;
                currentAnalysisData = data;
                renderCharts(data);

            } catch (e) {
                console.error(e);
                title.textContent = "Network Error";
            }
        }

        function closeModal() {
            document.getElementById('analysis-modal').classList.add('hidden');
            currentAnalysisData = null;
        }

        // Close on clicking background
        document.getElementById('analysis-modal').addEventListener('click', (e) => {
            if (e.target.id === ('analysis-modal')) closeModal();
        });

        function updateHourlyChart(day) {
            if (!currentAnalysisData) return;

            // Update UI buttons
            document.querySelectorAll('.chart-filter-btn').forEach(b => {
                b.classList.remove('active');
                if ((day === 'All' && b.textContent === 'All') ||
                    (day === 'Mon' && b.textContent === '月') ||
                    (day === 'Tue' && b.textContent === '火') ||
                    (day === 'Wed' && b.textContent === '水') ||
                    (day === 'Thu' && b.textContent === '木') ||
                    (day === 'Fri' && b.textContent === '金') ||
                    (day === 'Sat' && b.textContent === '土') ||
                    (day === 'Sun' && b.textContent === '日')) {
                    b.classList.add('active');
                }
            });

            // Business hours mapping for X-axis
            // 18->18, 23->23, 0->24, 1->25 ... 5->29
            const businessHours = [18, 19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5];

            let scatterData = [];
            let pointColor = 'rgba(255, 107, 107, 0.5)'; // Transparent for stacking

            // Helper to get mapped x (for sorting)
            const getX = (h) => h < 10 ? h + 24 : h;

            businessHours.forEach(h => {
                let values;
                if (day === 'All') {
                    values = currentAnalysisData.hourly_raw[h] || [];
                } else {
                    const dayData = currentAnalysisData.hourly_raw_by_weekday[day] || {};
                    values = dayData[h] || [];
                }

                // Add points
                values.forEach(val => {
                    scatterData.push({
                        x: getX(h),
                        y: val
                    });
                });
            });

            if (day !== 'All') {
                pointColor = 'rgba(51, 154, 240, 0.6)';
            }

            if (hourlyChartInstance) hourlyChartInstance.destroy();

            const ctxH = document.getElementById('hourlyChart').getContext('2d');
            hourlyChartInstance = new Chart(ctxH, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: day === 'All' ? 'Distribution' : day,
                        data: scatterData,
                        backgroundColor: pointColor,
                        borderColor: pointColor,
                        borderWidth: 0,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            title: { display: true, text: 'Ladies Count' }
                        },
                        x: {
                            grid: { display: false },
                            type: 'linear',
                            position: 'bottom',
                            min: 17.5,
                            max: 29.5,
                            ticks: {
                                stepSize: 1,
                                callback: function (value, index, values) {
                                    // Convert 24+ back to 0+
                                    let h = value;
                                    if (h >= 24) h -= 24;
                                    return h + ":00";
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    return context.raw.y + "人";
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderCharts(data) {
            // Render specific day chart (Average by default)
            updateHourlyChart('All');

            // --- Render Weekday Chart (Static) ---
            const weekdayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const displayLabels = ['月', '火', '水', '木', '金', '土', '日'];
            const weekdayValues = weekdayLabels.map(day => data.weekday[day] || 0);

            if (weekdayChartInstance) weekdayChartInstance.destroy();

            const ctxW = document.getElementById('weekdayChart').getContext('2d');
            weekdayChartInstance = new Chart(ctxW, {
                type: 'bar',
                data: {
                    labels: displayLabels,
                    datasets: [{
                        label: 'Avg Ladies',
                        data: weekdayValues,
                        backgroundColor: 'rgba(77, 171, 247, 0.6)',
                        borderColor: 'rgba(77, 171, 247, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { display: false }
                    },
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const daysKey = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                            updateHourlyChart(daysKey[index]);
                        }
                    }
                }
            });
        }
    </script>
</body>

</html>
