<div id="aiseki-reading-progress" class="aiseki-reading-progress" aria-hidden="true"></div>
<div id="aiseki-nav-progress" class="aiseki-nav-progress" aria-hidden="true"></div>
<div id="aiseki-nav-pill" class="aiseki-nav-pill" role="status" aria-live="polite">
    <span id="aiseki-nav-spinner" class="aiseki-nav-spinner" aria-hidden="true"></span>
    <span id="aiseki-nav-pill-text" class="aiseki-nav-pill-text">読み込み中...</span>
</div>
<script>
(function() {
    if (window.__portalNavFastInit) return;
    window.__portalNavFastInit = true;

    var AFF_PFX = '/li' + 'nk/';
    var IS_STAFF_VIEW = {{ 'true' if ((is_staff is defined and is_staff) or (session is defined and session.get('is_staff'))) else 'false' }};
    var prefetchedAt = Object.create(null);
    var progAnim = null;
    var spinAnim = null;
    var safetyTimer = null;
    var pillDelayTimer = null;
    var navInFlight = false;
    var PILL_DELAY_MS = 180;

    function prefersReducedMotion() {
        try {
            return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        } catch (e) {
            return false;
        }
    }

    function clearPillDelay() {
        if (pillDelayTimer) { clearTimeout(pillDelayTimer); pillDelayTimer = null; }
    }

    // Never prefetch affiliate redirects, staff/API, OGP, machine-readable feeds or static binaries
    // (prefetching CSV/sitemap/llms would inflate primary-stats download metrics and waste bandwidth).
    var IGNORED_EXT_RE = /\.(csv|xml|txt|json|png|jpe?g|webp|gif|svg|mp4|webm|pdf|zip)$/i;
    function isIgnoredPath(pathname) {
        if (!pathname) return true;
        var p = String(pathname);
        var qPos = p.indexOf('?');
        var pathOnly = qPos >= 0 ? p.slice(0, qPos) : p;
        return pathOnly.indexOf(AFF_PFX) === 0
            || pathOnly.indexOf('/staff') === 0
            || pathOnly.indexOf('/api/') === 0
            || pathOnly.indexOf('/ogp/') === 0
            || pathOnly.indexOf('/static/') === 0
            || pathOnly === '/stats/monthly.csv'
            || pathOnly.indexOf('/sitemap') === 0
            || pathOnly.indexOf('/llms') === 0
            || pathOnly === '/robots.txt'
            || pathOnly === '/ads.txt'
            || IGNORED_EXT_RE.test(pathOnly);
    }

    function canBackgroundPrefetch() {
        if (IS_STAFF_VIEW) return false;
        if (window.location.pathname.indexOf('/staff') === 0) return false;
        if (window.APP_CONFIG && (window.APP_CONFIG.isStaff || window.APP_CONFIG.isStaffSession)) return false;
        try {
            var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) {
                if (conn.saveData) return false;
                var eff = String(conn.effectiveType || '').toLowerCase();
                if (eff === 'slow-2g' || eff === '2g' || eff === '3g') return false;
            }
        } catch (e) {}
        return true;
    }

    function prefetchUrl(rawHref) {
        if (IS_STAFF_VIEW) return;
        if (!rawHref || rawHref.charAt(0) !== '/' || rawHref.indexOf('//') === 0) return;
        var qIdx = rawHref.indexOf('#');
        var cleanHref = qIdx >= 0 ? rawHref.slice(0, qIdx) : rawHref;
        if (!cleanHref || isIgnoredPath(cleanHref)) return;
        var now = Date.now();
        if (prefetchedAt[cleanHref] && (now - prefetchedAt[cleanHref] < 25000)) return;
        prefetchedAt[cleanHref] = now;
        try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                fetch(cleanHref, {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: { 'X-Sw-Prefetch': '1' }
                }).catch(function() {});
                return;
            }
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = cleanHref;
            link.as = 'document';
            document.head.appendChild(link);
        } catch (e) {}
    }

    function resolveLoadingLabel(url) {
        var p = url.pathname || '/';
        var s = url.search || '';
        if (p === '/') {
            return s.indexOf('mode=women') !== -1
                ? '女性目線ランキング を読み込み中...'
                : 'リアルタイム順位 を読み込み中...';
        }
        if (p === '/concierge') return '3秒穴場＆ハシゴ診断 を読み込み中...';
        if (p === '/for-women') return '女子向け裏ガイド を読み込み中...';
        if (p === '/price-comparison') return '料金・イベント比較 を読み込み中...';
        if (p === '/columns') return 'コラム・記事一覧 を読み込み中...';
        if (p === '/areas') return 'エリア一覧 を読み込み中...';
        if (p.indexOf('/area/') === 0) return 'エリア別データ を読み込み中...';
        if (p.indexOf('/store/') === 0) return '店舗詳細データ を読み込み中...';
        if (p === '/stats') return '統計データ白書 を読み込み中...';
        if (p === '/grooming') return '服装・事前準備 を読み込み中...';
        if (p === '/guide/brand-comparison') return '3大ブランド比較 を読み込み中...';
        if (p.indexOf('/guide') === 0) return '特集コラム を読み込み中...';
        if (p === '/oriental-lounge' || p === '/ag' || p === '/jis') return 'ブランド別人数 を読み込み中...';
        return 'ページを読み込み中...';
    }

    function unlockModalsAndBodyScroll() {
        try {
            var openModals = document.querySelectorAll('.modal:not(.hidden)');
            for (var i = 0; i < openModals.length; i++) {
                openModals[i].classList.add('hidden');
            }
            if (document.body && document.body.style.overflow === 'hidden') {
                document.body.style.overflow = '';
            }
        } catch (e) {}
    }

    function resetNavLoading() {
        navInFlight = false;
        clearPillDelay();
        if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
        if (progAnim) { try { progAnim.cancel(); } catch (e) {} progAnim = null; }
        if (spinAnim) { try { spinAnim.cancel(); } catch (e) {} spinAnim = null; }
        var progEl = document.getElementById('aiseki-nav-progress');
        var pillEl = document.getElementById('aiseki-nav-pill');
        if (progEl) {
            progEl.classList.remove('is-active');
            progEl.style.transform = 'scaleX(0)';
        }
        if (pillEl) {
            pillEl.classList.remove('is-active');
        }
        var loadingLinks = document.querySelectorAll('.nav-loading');
        for (var i = 0; i < loadingLinks.length; i++) {
            loadingLinks[i].classList.remove('nav-loading');
        }
    }

    function showNavLoading(anchorEl, labelText) {
        if (anchorEl) anchorEl.classList.add('nav-loading');
        var progEl = document.getElementById('aiseki-nav-progress');
        var pillEl = document.getElementById('aiseki-nav-pill');
        var spinEl = document.getElementById('aiseki-nav-spinner');
        var textEl = document.getElementById('aiseki-nav-pill-text');
        if (textEl) textEl.textContent = labelText || '読み込み中...';
        if (progEl) progEl.classList.add('is-active');

        // Delay the centre pill: fast same-origin MPA navigations finish before 180ms,
        // so the pill never gets captured into the cross-document View Transition snapshot.
        clearPillDelay();
        if (pillEl) {
            pillDelayTimer = setTimeout(function() {
                pillDelayTimer = null;
                if (!navInFlight) return;
                pillEl.classList.add('is-active');
                // Run animations on the GPU compositor thread so they keep spinning smoothly during iOS Safari / mobile navigation wait
                if (spinEl && spinEl.animate && !prefersReducedMotion()) {
                    try {
                        if (spinAnim) spinAnim.cancel();
                        spinAnim = spinEl.animate(
                            [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
                            { duration: 550, iterations: Infinity }
                        );
                    } catch (e) {}
                }
                void pillEl.offsetWidth;
            }, PILL_DELAY_MS);
        }
        if (progEl && progEl.animate) {
            try {
                if (progAnim) progAnim.cancel();
                progAnim = progEl.animate(
                    [
                        { transform: 'scaleX(0.12)' },
                        { transform: 'scaleX(0.74)', offset: 0.45 },
                        { transform: 'scaleX(0.92)' }
                    ],
                    { duration: 2200, fill: 'forwards', easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
                );
            } catch (e) {}
        }
        // Force synchronous style flush so iOS Safari commits the progress layer immediately
        if (progEl) void progEl.offsetWidth;
        if (safetyTimer) clearTimeout(safetyTimer);
        safetyTimer = setTimeout(resetNavLoading, 3500);
    }

    function initEditorialReadingProgress() {
        var bar = document.getElementById('aiseki-reading-progress');
        if (!bar) return;
        var p = window.location.pathname || '/';
        if (p === '/' || p === '/columns' || p === '/areas' || p === '/concierge' || p.indexOf('/staff') === 0) return;
        var articleRoot = document.querySelector('.article-body, .article-content, .article-box, .guide-box, .content-box');
        if (!articleRoot) return;

        var ticking = false;
        function updateBar() {
            ticking = false;
            var docEl = document.documentElement;
            var scrollTop = window.pageYOffset || docEl.scrollTop || 0;
            var maxScroll = (docEl.scrollHeight || 0) - (window.innerHeight || docEl.clientHeight || 1);
            if (maxScroll <= 240) {
                bar.classList.remove('is-visible');
                return;
            }
            var ratio = Math.max(0, Math.min(1, scrollTop / maxScroll));
            if (scrollTop > 48) {
                bar.classList.add('is-visible');
            } else {
                bar.classList.remove('is-visible');
            }
            bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        }
        function onScroll() {
            if (!ticking) {
                ticking = true;
                if (window.requestAnimationFrame) {
                    window.requestAnimationFrame(updateBar);
                } else {
                    updateBar();
                }
            }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        updateBar();
    }

    function initTableScrollAffordance() {
        var frames = document.querySelectorAll('.table-scroll-frame');
        if (!frames.length) return;
        var entries = [];
        for (var i = 0; i < frames.length; i++) {
            var frame = frames[i];
            if (frame.__scrollAffordanceBound) continue;
            var scroller = frame.querySelector('.comp-table-wrap, .stats-table-wrap');
            if (!scroller) continue;
            frame.__scrollAffordanceBound = true;
            entries.push({ frame: frame, scroller: scroller });
        }
        if (!entries.length) return;

        function update(entry) {
            var scroller = entry.scroller;
            var frame = entry.frame;
            var overflowing = (scroller.scrollWidth - scroller.clientWidth) > 3;
            frame.setAttribute('data-overflowing', overflowing ? '1' : '0');
            frame.setAttribute('data-scroll-left', (overflowing && scroller.scrollLeft > 4) ? '1' : '0');
            frame.setAttribute('data-scroll-right', (overflowing && (scroller.scrollLeft + scroller.clientWidth < scroller.scrollWidth - 4)) ? '1' : '0');
        }
        function bindEntry(entry) {
            var ticking = false;
            entry.schedule = function() {
                if (ticking) return;
                ticking = true;
                var run = function() { ticking = false; update(entry); };
                if (window.requestAnimationFrame) window.requestAnimationFrame(run); else run();
            };
            entry.scroller.addEventListener('scroll', entry.schedule, { passive: true });
        }
        var ro = null;
        if (typeof window.ResizeObserver === 'function') {
            try {
                ro = new ResizeObserver(function(roEntries) {
                    for (var r = 0; r < roEntries.length; r++) {
                        var tgt = roEntries[r].target;
                        for (var k = 0; k < entries.length; k++) {
                            var sc = entries[k].scroller;
                            if (sc === tgt || (sc.contains && sc.contains(tgt))) entries[k].schedule();
                        }
                    }
                });
            } catch (e) { ro = null; }
        }
        for (var j = 0; j < entries.length; j++) {
            bindEntry(entries[j]);
            if (ro) {
                try {
                    ro.observe(entries[j].scroller);
                    var tbl = entries[j].scroller.querySelector('table');
                    if (tbl) ro.observe(tbl);
                } catch (e) {}
            }
            update(entries[j]);
        }
        window.addEventListener('resize', function() {
            for (var m = 0; m < entries.length; m++) entries[m].schedule();
        }, { passive: true });
    }

    function onDomReady() {
        initEditorialReadingProgress();
        try { initTableScrollAffordance(); } catch (e) {}
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onDomReady, { once: true });
    } else {
        onDomReady();
    }

    function onWarmInteraction(e) {
        if (!canBackgroundPrefetch()) return;
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var raw = a.getAttribute('href');
        if (raw && raw.charAt(0) === '/') prefetchUrl(raw);
    }

    // Hover warm-up: only after 120ms dwell (cursor merely passing over links no longer triggers prefetch)
    var hoverTimer = null;
    var hoverAnchor = null;
    function cancelHoverWarm() {
        if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
        hoverAnchor = null;
    }
    function onHoverWarm(e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a === hoverAnchor) return;
        cancelHoverWarm();
        hoverAnchor = a;
        hoverTimer = setTimeout(function() {
            hoverTimer = null;
            if (hoverAnchor === a) onWarmInteraction({ target: a });
        }, 120);
    }
    function onHoverOut(e) {
        if (!hoverAnchor) return;
        var to = e.relatedTarget;
        if (to && hoverAnchor.contains && hoverAnchor.contains(to)) return;
        cancelHoverWarm();
    }

    document.addEventListener('pointerdown', onWarmInteraction, { passive: true });
    document.addEventListener('touchstart', onWarmInteraction, { passive: true });
    document.addEventListener('mouseover', onHoverWarm, { passive: true });
    document.addEventListener('mouseout', onHoverOut, { passive: true });

    document.addEventListener('click', function(e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        if (a.hasAttribute('download')) return;
        var tgt = a.getAttribute('target');
        if (tgt && tgt.toLowerCase() !== '_self') return;
        var rawHref = a.getAttribute('href');
        if (!rawHref || rawHref.charAt(0) === '#' || rawHref.indexOf('javascript:') === 0 || rawHref.indexOf('mailto:') === 0 || rawHref.indexOf('tel:') === 0) return;

        var destUrl;
        try {
            destUrl = new URL(a.href, window.location.origin);
        } catch (err) {
            return;
        }
        if (destUrl.origin !== window.location.origin) return;
        if (destUrl.pathname.indexOf(AFF_PFX) === 0) return;
        // File downloads / feeds (CSV, XML, etc.): let the browser handle natively without a stuck nav spinner
        if (IGNORED_EXT_RE.test(destUrl.pathname)) return;

        if (destUrl.pathname === window.location.pathname && destUrl.search === window.location.search) {
            if (destUrl.hash) return;
            e.preventDefault();
            unlockModalsAndBodyScroll();
            resetNavLoading();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }

        if (navInFlight) {
            e.preventDefault();
            return;
        }
        navInFlight = true;

        unlockModalsAndBodyScroll();
        var targetHref = destUrl.pathname + destUrl.search + destUrl.hash;
        prefetchUrl(destUrl.pathname + destUrl.search);
        showNavLoading(a, resolveLoadingLabel(destUrl));

        // Guarantee 1 painted frame on iOS Safari before navigation unload freezes the page
        e.preventDefault();
        var navigated = false;
        function go() {
            if (navigated) return;
            navigated = true;
            window.location.assign(targetHref);
        }
        if (window.requestAnimationFrame) {
            window.requestAnimationFrame(function() {
                setTimeout(go, 0);
            });
            setTimeout(go, 34);
        } else {
            go();
        }
    });

    window.addEventListener('pageshow', function() {
        resetNavLoading();
        unlockModalsAndBodyScroll();
    });
    window.addEventListener('pagehide', function() {
        resetNavLoading();
        unlockModalsAndBodyScroll();
    });
    // Cross-document View Transitions: clear any pending pill before the new page is revealed
    window.addEventListener('pagereveal', function() {
        clearPillDelay();
        resetNavLoading();
    });

    // Ensure Service Worker v77 is registered on subpages too + warm primary tabs during idle
    window.addEventListener('load', function() {
        if ('serviceWorker' in navigator) {
            if (IS_STAFF_VIEW || window.location.pathname.indexOf('/staff') === 0) {
                try {
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'PURGE_HTML_CACHE' });
                    }
                } catch (e) {}
            } else if (!window.__swRegistered) {
                window.__swRegistered = true;
                navigator.serviceWorker.register('/sw.js?v=109', { updateViaCache: 'none' }).then(function(reg) {
                    // Throttle explicit SW update checks to once per 10 minutes per tab session
                    try {
                        var KEY = 'aiseki_sw_update_at';
                        var last = Number(sessionStorage.getItem(KEY) || 0);
                        var nowTs = Date.now();
                        if (reg && reg.update && (!last || nowTs - last > 600000)) {
                            sessionStorage.setItem(KEY, String(nowTs));
                            reg.update().catch(function() {});
                        }
                    } catch (e) {}
                }).catch(function() {});
            }
        }
        if (canBackgroundPrefetch()) {
            var runWarm = function() {
                var warmTargets = ['/', '/price-comparison'];
                for (var i = 0; i < warmTargets.length; i++) {
                    if (warmTargets[i] !== window.location.pathname) {
                        prefetchUrl(warmTargets[i]);
                    }
                }
            };
            if (typeof window.requestIdleCallback === 'function') {
                window.requestIdleCallback(runWarm, { timeout: 2500 });
            } else {
                setTimeout(runWarm, 900);
            }
        }
    });
})();
</script>
